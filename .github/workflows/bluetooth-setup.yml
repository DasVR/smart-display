name: Bluetooth Audio Setup

# Manual, one-off provisioning: Bluetooth A2DP speaker, AirPlay receiver,
# default sink pick, and a doctor report. Not tied to push-to-master.
on:
  workflow_dispatch:

jobs:
  bluetooth-setup:
    runs-on: [self-hosted, linux, x64, kiosk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run speaker-audio-setup.sh
        run: |
          cd /home/das/projects/smart-display
          chmod +x scripts/speaker-audio-setup.sh
          ./scripts/speaker-audio-setup.sh

      - name: Diagnostics (adapter, services, audio sinks, AirPlay)
        if: always()
        run: |
          cd /home/das/projects/smart-display
          chmod +x scripts/audio-doctor.sh scripts/audio-pick-sink.mjs
          ./scripts/audio-doctor.sh || true
          echo "--- bluetoothctl show ---"
          bluetoothctl show || true
          echo "--- smart-display-bt-agent ---"
          sudo systemctl status smart-display-bt-agent --no-pager || true
          echo "--- smart-display-bt-watch ---"
          sudo systemctl status smart-display-bt-watch --no-pager || true
          echo "--- mpris-proxy (user) ---"
          systemctl --user status mpris-proxy --no-pager 2>/dev/null \
            || systemctl --user status smart-display-mpris-proxy --no-pager || true
          echo "--- AirPlay user units ---"
          systemctl --user status smart-display-airplay --no-pager || true
          systemctl --user status smart-display-airplay-meta --no-pager || true
          echo "--- shairport-sync -V ---"
          shairport-sync -V 2>/dev/null || true
          echo "--- avahi / nqptp ---"
          systemctl is-active avahi-daemon || true
          systemctl is-active nqptp || true
          echo "--- wpctl status ---"
          wpctl status || true
          echo "--- pactl sources (bluez_input should appear when a phone is connected) ---"
          pactl list short sources || true
          echo "--- bluetooth main.conf ---"
          cat /etc/bluetooth/main.conf || true
          echo "--- ALSA cards ---"
          cat /proc/asound/cards 2>/dev/null || echo "no /proc/asound/cards"
          aplay -l 2>&1 || true
          echo "--- PCI/USB audio hardware ---"
          lspci -nnk 2>/dev/null | grep -iA3 audio || echo "lspci not available or no PCI audio device"
          lsusb 2>/dev/null | grep -i audio || true
          echo "--- can 'das' actually access the ALSA devices? ---"
          groups das || true
          ls -la /dev/snd/ || true
          echo "--- wireplumber bluetooth conf ---"
          cat /home/das/.config/wireplumber/wireplumber.conf.d/51-bluez-a2dp-sink.conf || true
          echo "--- wireplumber journal ---"
          journalctl --user -u wireplumber -b --no-pager 2>&1 | tail -40 || true
