name: Bluetooth Audio Setup

# Manual, one-off provisioning: installs bluez/mpris-proxy, sets the
# Bluetooth device class to Audio/Speaker, enables the A2DP sink role,
# and installs/starts the pairing-agent + connect-watch + mpris-proxy
# services. Not tied to push-to-master (unlike deploy-kiosk.yml) since
# it changes system-level Bluetooth/PipeWire config and should only run
# when someone deliberately asks for it.
on:
  workflow_dispatch:

jobs:
  bluetooth-setup:
    runs-on: [self-hosted, linux, x64, kiosk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bluetooth-audio-setup.sh
        run: |
          cd /home/das/projects/smart-display
          chmod +x scripts/bluetooth-audio-setup.sh
          ./scripts/bluetooth-audio-setup.sh

      - name: Diagnostics (adapter, services, audio sinks)
        if: always()
        run: |
          echo "--- bluetoothctl show ---"
          bluetoothctl show || true
          echo "--- smart-display-bt-agent ---"
          sudo systemctl status smart-display-bt-agent --no-pager || true
          echo "--- smart-display-bt-watch ---"
          sudo systemctl status smart-display-bt-watch --no-pager || true
          echo "--- mpris-proxy (user) ---"
          systemctl --user status mpris-proxy --no-pager 2>/dev/null \
            || systemctl --user status smart-display-mpris-proxy --no-pager || true
          echo "--- wpctl status (find the analog/headphone-jack sink ID here) ---"
          wpctl status || true
          echo "--- bluetooth main.conf (confirm the Audio/Speaker class actually landed) ---"
          cat /etc/bluetooth/main.conf || true
          echo "--- ALSA cards (is there a real sound card at all?) ---"
          cat /proc/asound/cards 2>/dev/null || echo "no /proc/asound/cards"
          aplay -l 2>&1 || true
          echo "--- PCI/USB audio hardware ---"
          lspci -nnk 2>/dev/null | grep -iA3 audio || echo "lspci not available or no PCI audio device"
          lsusb 2>/dev/null | grep -i audio || true
