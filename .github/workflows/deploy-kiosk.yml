name: Deploy + Reboot Display

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-kiosk:
    # Self-hosted runner on the display server. Runs as the 'das' user
    # (lingering enabled) so it can restart the kiosk services.
    runs-on: [self-hosted, linux, x64, kiosk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy + rebuild + reboot kiosk
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
