<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Remote — Smart Display</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #050507; color: #f5f2ec; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    #status { width: 14px; height: 14px; border-radius: 50%; background: #333; transition: .3s; }
    #status.connected { background: #00d992; box-shadow: 0 0 10px #00d99280; }
    .row { display: flex; gap: 30px; }
    button { width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: white; font-size: 28px; cursor: pointer; }
    button:active { transform: scale(.92); background: rgba(255,255,255,.14); }
    .pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
    .pill { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: rgba(255,255,255,.5); font-size: 13px; text-transform: uppercase; cursor: pointer; }
    .pill.active { background: rgba(169,177,240,.2); color: rgba(242,240,247,.9); border-color: rgba(169,177,240,.4); }
    #view { font-family: monospace; font-size: 16px; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .1em; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="status"></div>
  <div class="row">
    <button onclick="swipe('right')">◀</button>
    <button onclick="swipe('left')">▶</button>
  </div>
  <div id="view">clock</div>
  <div class="pills">
    <button class="pill" onclick="go('clock')">clock</button>
    <button class="pill" onclick="go('school')">school</button>
    <button class="pill" onclick="go('dev')">dev</button>
    <button class="pill" onclick="go('music')">music</button>
  </div>

  <script>
    const host = location.host;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws, current = 'clock';

    function connect() {
      ws = new WebSocket(`${proto}//${host}/ws`);
      ws.onopen = () => { document.getElementById('status').className = 'connected'; };
      ws.onclose = () => { document.getElementById('status').className = ''; setTimeout(connect, 1500); };
      ws.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === 'init' || m.type === 'navigate') {
            current = m.view;
            document.getElementById('view').textContent = current;
            document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.textContent === current));
          }
        } catch {}
      };
    }
    connect();

    function swipe(dir) {
      if (ws?.readyState === 1) ws.send(JSON.stringify({type: 'swipe', dir}));
    }
    function go(view) {
      if (ws?.readyState === 1) ws.send(JSON.stringify({type: 'navigate', view}));
    }

    // keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') swipe('left');
      if (e.key === 'ArrowLeft') swipe('right');
    });
  </script>
</body>
</html>
