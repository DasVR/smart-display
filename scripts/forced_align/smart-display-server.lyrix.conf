[Service]
# CPU WhisperX venv on the das-server host. Install with
# scripts/forced_align/install-host-venv.sh --apply-systemd
Environment="LYRICS_PYTHON_BIN=/home/das/venvs/lyrix/bin/python"
Environment="FORCED_ALIGN_ENGINE=auto"
Environment="FORCED_ALIGN_DEVICE=cpu"
Environment="FORCED_ALIGN_WHISPER_MODEL=large-v3"
Environment="FORCED_ALIGN_ALIGN_MODEL=jonatasgrosman/wav2vec2-large-xlsr-53-english"
Environment="FORCED_ALIGN_SEPARATE=1"
Environment="PATH=/home/das/venvs/lyrix/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
