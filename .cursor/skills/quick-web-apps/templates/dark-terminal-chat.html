<!--
Dark terminal-style LLM chat UI template.
Matches the user's portfolio aesthetic: dark abyss background, green (#00d992) accents,
JetBrains Mono font, CRT scanlines, matrix rain, terminal window chrome.
Drop-in single-file HTML — no build step needed.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --abyss: #050507;
            --carbon: #0d0d0f;
            --carbon-light: #141417;
            --charcoal: #1a1a1d;
            --border: #2a2a2e;
            --border-warm: #3d3a39;
            --green: #00d992;
            --green-mint: #2fd6a1;
            --green-dim: #008f5f;
            --green-glow: rgba(0, 217, 146, 0.15);
            --text: #e8e6e3;
            --text-dim: #8b949e;
            --text-faint: #4a4a52;
            --mono: 'JetBrains Mono', monospace;
        }
        html { height: -webkit-fill-available; }
        body { background: var(--abyss); color: var(--text); font-family: var(--mono); font-size: 14px; height: 100vh; height: 100dvh; overflow: hidden; }
        .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12), rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px); opacity: 0.3; }
        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 9998; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.35) 100%); }
        .app { display: flex; height: 100vh; position: relative; z-index: 1; }

        /* Sidebar */
        .sidebar { width: 260px; min-width: 260px; background: var(--carbon); border-right: 1px solid var(--border-warm); display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-text { font-size: 16px; font-weight: 700; color: var(--green); text-shadow: 0 0 6px var(--green-glow); }

        /* Messages */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { display: flex; gap: 12px; max-width: 85%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.assistant { align-self: flex-start; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .msg.user .msg-avatar { background: var(--carbon); border: 1px solid var(--border-warm); }
        .msg.assistant .msg-avatar { background: var(--green-glow); border: 1px solid var(--green-dim); }
        .msg-bubble { padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.65; word-break: break-word; }
        .msg.user .msg-bubble { background: var(--carbon); border: 1px solid var(--border-warm); }
        .msg.assistant .msg-bubble { background: var(--carbon-light); border: 1px solid var(--border); }
        .msg-bubble pre { background: var(--abyss); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
        .msg-bubble code { font-family: var(--mono); font-size: 12px; color: var(--green-mint); }

        /* Input */
        .input-area { padding: 16px 20px; border-top: 1px solid var(--border-warm); background: var(--carbon); }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea { flex: 1; padding: 10px 14px; background: var(--carbon-light); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-family: var(--mono); font-size: 13px; resize: none; outline: none; min-height: 42px; transition: border-color 0.2s; }
        .input-row textarea:focus { border-color: var(--green); box-shadow: 0 0 10px var(--green-glow); }
        .send-btn { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--green); background: var(--carbon); color: var(--green-mint); font-family: var(--mono); font-size: 13px; font-weight: 700; cursor: pointer; }
        .send-btn:hover { background: var(--green-glow); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Typing */
        .typing { display: none; align-self: flex-start; }
        .typing.active { display: flex; }
        .typing .msg-bubble { display: flex; gap: 4px; padding: 14px 18px; }
        .typing .msg-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: typeBounce 1.4s infinite ease-in-out; }
        .typing .msg-bubble span:nth-child(2) { animation-delay: 0.2s; }
        .typing .msg-bubble span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typeBounce { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><span class="logo-text">$ chat</span></div>
            </div>
        </aside>
        <div class="main">
            <div class="messages" id="messages">
                <div class="typing" id="typing">
                    <div class="msg-avatar">⬡</div>
                    <div class="msg-bubble"><span></span><span></span><span></span></div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-row">
                    <textarea id="input" placeholder="$ enter message..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn">send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const input = document.getElementById('input');
        const btn = document.getElementById('sendBtn');
        const msgs = document.getElementById('messages');
        const typing = document.getElementById('typing');

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = `
                <div class="msg-avatar">${role==='user'?'>':'⬡'}</div>
                <div class="msg-bubble">${text}</div>
            `;
            msgs.insertBefore(div, typing);
            msgs.scrollTop = msgs.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            addMsg('user', text);
            input.value = '';
            typing.classList.add('active');
            // Call your API here
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message:text}) });
            typing.classList.remove('active');
            const data = await res.json();
            addMsg('assistant', data.content || JSON.stringify(data));
        }

        btn.addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    </script>
</body>
</html>
