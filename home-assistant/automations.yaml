# Home Assistant automations for smart display
# The kiosk server also turns HDMI off at 22:30 and on at 06:00
# (America/New_York) by itself. Times can be changed from the phone remote.
# Paste into HA UI (Settings → Automations & Scenes → YAML mode) or drop into /config/automations.yaml
- id: smart_display_morning
  alias: Smart Display — Morning Mode
  description: Switch display to school view and show morning briefing at 6:30 AM
  trigger:
    - platform: time
      at: "06:30:00"
  action:
    - service: rest_command.smart_display_morning

- id: smart_display_sleep
  alias: Smart Display — Sleep Mode
  description: Sleep + cut the panel at 10:30 PM (LCD still glows if we only dim)
  trigger:
    - platform: time
      at: "22:30:00"
  action:
    - service: rest_command.smart_display_sleep

- id: smart_display_hdmi_off
  alias: Smart Display — HDMI Off
  description: Power the HDMI output off at 10:30 PM (same window as sleep)
  trigger:
    - platform: time
      at: "22:30:00"
  action:
    - service: rest_command.smart_display_hdmi_off

- id: smart_display_hdmi_on
  alias: Smart Display — HDMI On
  description: Turn HDMI back on at 6:00 AM
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - service: rest_command.smart_display_hdmi_on

# Phone screen-on / boot. Companion App (Android) exposes
# binary_sensor.<device>_interactive. Replace the entity_id with yours
# (Developer Tools → States, search "interactive"). iOS does not always
# publish interactive; the kiosk also polls HA for that sensor as backup.
# Window matches the server: only while the panel is in night-off hours
# after 5:00 AM, so a 1 AM notification does not light the room.
- id: smart_display_phone_wake
  alias: Smart Display — Phone Wake
  description: Wake the panel when the phone screen comes on after 5 AM
  trigger:
    - platform: state
      entity_id: binary_sensor.REPLACE_ME_interactive
      from:
        - "off"
        - "unavailable"
        - "unknown"
      to: "on"
  condition:
    - condition: time
      after: "05:00:00"
      before: "11:00:00"
  action:
    - service: rest_command.smart_display_phone_wake

